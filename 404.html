<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://kliks.com.au/kliks-monogram-3A-solid.png">
  <title>Ez az oldal nem található | Kliks Digital</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root { --orange: #ff4315; --orange-dark: #c42f08; --bg: #0e0d1a; --white: #ffffff; --muted: rgba(255,255,255,0.62); --line: rgba(255,255,255,0.08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--white); font-family: 'Satoshi', sans-serif; line-height: 1.7; }
    nav { border-bottom: 1px solid var(--line); }
    .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; }
    .logo { font-family: 'Clash Display', sans-serif; font-size: 22px; font-weight: 700; color: var(--white); text-decoration: none; }
    .logo span { color: var(--orange); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px 24px; text-align: center; }
    .code { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: var(--orange); margin-bottom: 16px; }
    h1 { font-family: 'Clash Display', sans-serif; font-size: clamp(32px, 6vw, 52px); font-weight: 700; line-height: 1.12; letter-spacing: 0.01em; margin-bottom: 16px; }
    p { color: var(--muted); font-size: 17px; max-width: 460px; margin: 0 auto 32px; }
    .btn { display: inline-block; background: var(--orange); color: var(--white); text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 32px; border-radius: 100px; transition: background 0.2s ease; }
    .btn:hover { background: var(--orange-dark); }
    .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo">KLIKS<span>.</span></a>
  </div>
</nav>

<main>
  <div>
    <span class="code">404</span>
    <h1>Ez az oldal nem található</h1>
    <p>Lehet, hogy elírtad a címet, vagy az oldal már nincs meg.</p>
    <a href="/" class="btn">Vissza a főoldalra</a>
  </div>
</main>

</body>
</html>
